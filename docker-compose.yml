version: '3.8'

services:
  backend:
    build: ./backend
    container_name: review_intellect_backend
    ports:
      - "8000:8000"
    volumes:
      - backend_db:/app/data
    environment:
      - PORT=8000
    restart: always

  frontend:
    build: ./frontend
    container_name: review_intellect_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_db:
